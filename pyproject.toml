[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dumen"
version = "0.7.5"
description = "Frontier AI Mechanistic Auditing, SAE Interpretability, and Runtime Activation Steering Engine"
readme = "README.md"
keywords = ["ai-safety", "eu-ai-act", "red-teaming", "interpretability", "llm-evaluation", "activation-steering", "compliance", "auditing"]
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Dümen contributors", email = "256555322+goun7@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "click>=8.0.0",
    "cryptography>=42.0",
    "mistune>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.16.1",
    "ruff>=0.5.0",
]
model = [
    # Gerçek-model entegrasyon testleri + `audit --model` / --measure-steering hattı
    "transformers>=4.40",
]
redteam = [
    "inspect-ai>=0.3.0",
]

[project.scripts]
dumen = "dumen.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["dumen"]

[tool.hatch.build.targets.sdist]
# Whitelist: root files outside this list (notes, journals, local tool state)
# can NEVER enter the sdist even when committed — PyPI leakage is made
# structurally impossible (found by the 2026-09-15 release audit).
include = [
  "dumen", "tests", "examples", "scripts", "brand", ".github",
  "pyproject.toml", "LICENSE", "README.md", "README_TR.md",
  "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md", "CITATION.cff",
  "CODE_OF_CONDUCT.md",
]
exclude = ["scripts/prepare_public.sh"]  # maskeleme-reçetesi + yasaklı-liste yayının kendisi değildir; kişisel-yol literal içerir

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["dumen"]
omit = ["dumen/__pycache__/*"]

