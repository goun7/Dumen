[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dumen"
version = "0.7.2"
description = "Frontier AI Mechanistic Auditing, SAE Interpretability, and Runtime Activation Steering Engine"
readme = "README.md"
keywords = ["ai-safety", "eu-ai-act", "red-teaming", "interpretability", "llm-evaluation", "activation-steering", "compliance", "auditing"]
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Gökün & Antigravity Sovereign", email = "dev@dumen.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.16.1",
    "ruff>=0.5.0",
]
model = [
    # Gerçek-model entegrasyon testleri + `audit --model` / --measure-steering hattı
    "transformers>=4.40",
]
redteam = [
    "inspect-ai>=0.3.0",
]

[project.scripts]
dumen = "dumen.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["dumen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["dumen"]
omit = ["dumen/__pycache__/*"]

