[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dumen"
version = "0.2.0"
description = "Frontier AI Mechanistic Auditing, SAE Interpretability, and Runtime Activation Steering Engine"
readme = "an internal planning doc"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Gökün & Antigravity Sovereign", email = "dev@dumen.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
redteam = [
    "inspect-ai>=0.3.0",
]

[project.scripts]
dumen = "dumen.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["dumen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

